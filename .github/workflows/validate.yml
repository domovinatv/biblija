name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # tjedno: je li se izvor na eBible.org promijenio

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preuzmi izvore
        run: scripts/fetch_saric.sh
      - name: Izgradi JSON
        run: python3 -I scripts/build_saric.py
      - name: Validacija
        run: python3 -I scripts/validate.py
      - name: Build je ponovljiv (data/saric bez razlika)
        run: git diff --stat --exit-code -- data/saric data/saric-errata.json
